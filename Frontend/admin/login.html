<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — Door2Door Laundry</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="../css/admin.css" />
</head>
<body class="admin-login-body">

  <div class="admin-login-wrap">
    <div class="admin-login-card">

      <div class="admin-login-brand">
        <span class="admin-login-icon">🧺</span>
        <h1>Door2Door</h1>
        <p>Admin Console</p>
      </div>

      <div id="loginForm">
        <div class="form-group">
          <label class="form-label" for="email">Admin Email</label>
          <input
            type="email"
            id="email"
            class="form-input"
            placeholder="admin@door2door.com"
            autocomplete="username"
          />
          <span class="field-error" id="err-email"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              class="form-input"
              placeholder="Your password"
              autocomplete="current-password"
            />
            <button type="button" class="pwd-toggle" id="pwdToggle" aria-label="Show/hide password">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <span class="field-error" id="err-password"></span>
        </div>

        <div class="form-error-banner" id="formErrorBanner" style="display:none">
          <span>⚠️</span>
          <span id="formErrorMsg"></span>
        </div>

        <button class="btn-submit" type="button" id="loginBtn" onclick="submitAdminLogin()">
          <span id="loginText">Sign In</span>
          <span id="loginSpinner" class="btn-spinner" style="display:none"></span>
        </button>

        <p class="admin-login-back"><a href="../login.html">← Back to customer login</a></p>
      </div>

    </div>
  </div>

  <!-- Scripts — order matters -->
  <script src="../js/auth.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/admin-login.js"></script>
</body>
</html>
